name: Deploy SIS3 to ECS

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  CFN_STACK_NAME: sis3-copy
  ECR_REPOSITORY: sis3-main-repository-d9rmmzgamhzo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Get VPC and Subnets from existing stack
        id: stack-params
        run: |
          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name $CFN_STACK_NAME \
            --query "Stacks[0].Parameters[?ParameterKey=='VpcId'].ParameterValue" \
            --output text)
          SUBNET_IDS=$(aws cloudformation describe-stacks \
            --stack-name $CFN_STACK_NAME \
            --query "Stacks[0].Parameters[?ParameterKey=='SubnetIds'].ParameterValue" \
            --output text)
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "subnet_ids=$SUBNET_IDS" >> $GITHUB_OUTPUT

      - name: Update CloudFormation stack with new image tag
        run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name $CFN_STACK_NAME \
            --parameter-overrides \
              ImageTag=$IMAGE_TAG \
              VpcId=${{ steps.stack-params.outputs.vpc_id }} \
              SubnetIds=${{ steps.stack-params.outputs.subnet_ids }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region $AWS_REGION

      - name: Verify new task definition revision
        run: |
          aws ecs describe-task-definition \
            --task-definition $CFN_STACK_NAME-app \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text
